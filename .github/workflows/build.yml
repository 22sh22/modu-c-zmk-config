name: Build MODU-C ZMK firmware

"on":
  push:
    paths:
      - "config/**"
      - "scripts/**"
      - "build.yaml"
      - ".github/workflows/build.yml"
      - "LICENSE"
      - "NOTICE.md"
      - "THIRD_PARTY_NOTICES.md"
      - "LICENSES/**"
  pull_request:
    paths:
      - "config/**"
      - "scripts/**"
      - "build.yaml"
      - ".github/workflows/build.yml"
      - "LICENSE"
      - "NOTICE.md"
      - "THIRD_PARTY_NOTICES.md"
      - "LICENSES/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modu-c-zmk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Keymap Editor and packaging files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout user config
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run static consistency checks
        run: python3 scripts/validate.py

      - name: Exercise HEX and UF2 safeguards
        run: python3 scripts/selftest.py

  build:
    name: Build both halves
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: zmkfirmware/zmk-build-arm:stable
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout user config
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch pinned sources
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Apply UART changes to build sources only
        run: |
          test "$(git -C zmk rev-parse HEAD)" = "641514a97db345f499dd50b0360e594270f008fe"
          test "$(git -C modu-c-firmware rev-parse HEAD)" = "bee0bb4b812f63f279eb67e928accc89600b5904"
          git apply --check config/uart.patch
          git apply config/uart.patch

      - name: Build both halves from build.yaml
        run: |
          python3 - <<'PY'
          import os
          import shlex
          import shutil
          import subprocess
          from pathlib import Path
          import yaml

          root = Path.cwd()
          artifacts = root / "intermediate"
          artifacts.mkdir()
          for target in yaml.safe_load(Path("build.yaml").read_text())["include"]:
              name = target["artifact-name"]
              output = root / "build" / name
              command = ["west", "build", "-s", "zmk/app", "-d", str(output),
                         "-b", target["board"]]
              if target.get("snippet"):
                  command += ["-S", target["snippet"]]
              command += ["--", f"-DZMK_CONFIG={root / 'config'}",
                          f"-DSHIELD={target['shield']}"]
              command += shlex.split(os.path.expandvars(target.get("cmake-args", "")))
              subprocess.run(command, check=True)
              config = (output / "zephyr" / ".config").read_text()
              for setting in ("CONFIG_ZMK_SPLIT_BLE=y", "CONFIG_ZMK_SPLIT_WIRED=y",
                              "CONFIG_ZMK_SPLIT_WIRED_HANDSHAKE=y",
                              "CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y"):
                  if setting not in config.splitlines():
                      raise SystemExit(f"{name}: missing {setting}")
              print(config, flush=True)
              print((output / "zephyr" / "zephyr.dts").read_text(), flush=True)
              native = output / "zephyr" / "zmk.uf2"
              source = native if native.is_file() else output / "zephyr" / "zmk.hex"
              shutil.copy2(source, artifacts / f"{name}{source.suffix}")
          PY

      - name: Upload intermediate build outputs
        uses: actions/upload-artifact@v7
        with:
          name: modu-c-intermediate
          path: intermediate/
          if-no-files-found: error

  package:
    name: Package and verify flashable UF2 files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout wrapper and license notices
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download both build outputs
        uses: actions/download-artifact@v7
        with:
          name: modu-c-intermediate
          path: intermediate

      - name: Checkout pinned MODU-C UF2 converter
        uses: actions/checkout@v7
        with:
          repository: 22sh22/modu-c-firmware
          ref: bee0bb4b812f63f279eb67e928accc89600b5904
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            tools/uf2

      - name: Select, convert, and validate both firmware files
        run: >-
          python3 scripts/package_firmware.py
          --intermediate intermediate
          --converter upstream/tools/uf2/uf2conv.py
          --output uf2
          --family 0xADA52840

      - name: Verify final UF2 files again
        run: python3 scripts/verify_uf2.py uf2/modu_left.uf2 uf2/modu_right.uf2

      - name: Include license and attribution files
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md uf2/
          cp -R LICENSES uf2/LICENSES

      - name: Upload flashable firmware with notices
        uses: actions/upload-artifact@v7
        with:
          name: modu-c-firmware
          path: uf2/
          if-no-files-found: error

      - name: Delete intermediate build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "modu-c-intermediate") | .id'
          )"
          test -n "${artifact_id}"
          gh api --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
