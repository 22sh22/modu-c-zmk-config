name: Build MODU-C ZMK firmware

"on":
  push:
    paths:
      - "config/**"
      - "scripts/validate.py"
      - "build.yaml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config/**"
      - "scripts/validate.py"
      - "build.yaml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modu-c-zmk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Keymap Editor files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v7

      - name: Run static checks
        run: python3 scripts/validate.py

  build:
    name: Build both halves
    needs: validate
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@641514a97db345f499dd50b0360e594270f008fe
    with:
      fallback_binary: hex
      archive_name: modu-c-intermediate

  package:
    name: Package flashable UF2 files
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wrapper and license notices
        uses: actions/checkout@v7

      - name: Download both build outputs
        uses: actions/download-artifact@v7
        with:
          name: modu-c-intermediate
          path: intermediate

      - name: Checkout pinned MODU-C UF2 converter
        uses: actions/checkout@v7
        with:
          repository: 22sh22/modu-c-firmware
          ref: af7d209d8c2fe6c03ef38669f4114b69346ad31d
          path: upstream
          sparse-checkout: |
            tools/uf2

      - name: Use native UF2 or convert HEX to UF2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uf2

          mapfile -t native_uf2 < <(find intermediate -type f -name '*.uf2' | sort)
          if [[ "${#native_uf2[@]}" -eq 2 ]]; then
            for file in "${native_uf2[@]}"; do
              cp "$file" "uf2/$(basename "$file")"
            done
          else
            mapfile -t hex_files < <(find intermediate -type f -name '*.hex' | sort)
            if [[ "${#hex_files[@]}" -ne 2 ]]; then
              printf 'Expected two UF2 files or two HEX files. Found %s UF2 and %s HEX.\n' \
                "${#native_uf2[@]}" "${#hex_files[@]}" >&2
              find intermediate -maxdepth 3 -type f -print >&2
              exit 1
            fi

            for file in "${hex_files[@]}"; do
              stem="$(basename "${file%.hex}")"
              python3 upstream/tools/uf2/uf2conv.py \
                -f 0xADA52840 \
                -c \
                -o "uf2/${stem}.uf2" \
                "$file"
            done
          fi

          test -s uf2/modu_left.uf2
          test -s uf2/modu_right.uf2
          sha256sum uf2/*.uf2

      - name: Include license and attribution files
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md uf2/
          cp -R LICENSES uf2/LICENSES

      - name: Upload flashable firmware with notices
        uses: actions/upload-artifact@v7
        with:
          name: modu-c-firmware
          path: uf2/**
          if-no-files-found: error
